exclude: 'docs|node_modules|migrations|.git|.tox'
default_stages: [pre-commit]
fail_fast: true

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: (^|/)a/.+\.(py|html|sh|css|js)$

-   repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (python)
        entry: isort
        language: python
        types: [ python ]
-   repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        types: [python]
-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: python
        types: [python]
